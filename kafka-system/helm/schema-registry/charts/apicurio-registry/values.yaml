nameOverride: ""
fullnameOverride: ""

registry:
  enabled: true
  name: apicurio-registry

  app:
    replicas: 1

    ingress:
      enabled: false
      host: ""
      ingressClassName: nginx
      annotations:
        nginx.org/proxy-connect-timeout: "30s"

    auth:
      enabled: true
      # registry-client-api Used by the Apicurio Registry backend (REST API) component.
      appClientId: registry-client-api
      uiClientId: registry-client-ui
      authServerUrl: https://keycloak.example.com/realms/registry
      redirectUri: https://registry-ui.example.com
      logoutUrl: https://registry-ui.example.com

    resources:
      requests:
        cpu: 0.5
        memory: 512Mi
      limits:
        cpu: 1
        memory: 1Gi

    podDisruptionBudget: 
      enabled: false

  ui:
    enabled: true
    
    replicas: 2

    # Configuring ingress
    ingress:
      enabled: false
      host: ""
      ingressClassName: nginx
      annotations:
        nginx.org/proxy-connect-timeout: "30s"

    # configuring UI environemnt variables
    env: []

    podDisruptionBudget:
      enabled: false

  # docs: https://www.apicur.io/registry/docs/apicurio-registry/3.3.x/getting-started/assembly-deploying-registry-operator.html
  storage:
    # postgresql, mysql, kafkasql, or kubernetesops
    type: ~

    # for type sql
    sql:
      dataSource:
        url: jdbc:postgresql://postgresql.my-project.svc:5432/registry
        username: registry_user
        password:
          name: postgresql-credentials
          key: password

    # for type kafkasql
    # kafkasql:
    #   bootstrapServers: kafka-cluster-kafka-bootstrap.kafka.svc:9092
    #   tls:
    #     truststoreSecretRef:
