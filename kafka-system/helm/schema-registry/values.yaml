global:
  imageRegistry: quay.io
  imageRepository: dwh
  imagePullSecrets: []
    # - name: dockerhub-regcred
  imagePullPolicy: IfNotPresent
  imageTag: "3.3.0"

  images:
    operator:
      name: apicurio-registry-3-operator
      tag: ~

    app:
      name: apicurio-registry
      tag: ~

    ui:  
      name: apicurio-registry-ui
      tag: ~

    gitops:
      name: apicurio-registry-gitops-sync
      tag: ~
  
operator:
  enabled: true

  operator:
    enabled: true

    replicas: 1

    watchNamespaces:
      - kafka

    resources:
      limits:
        cpu: 200m
        memory: 500Mi
      requests:
        cpu: 100m
        memory: 100Mi

registry:
  enabled: true
  
  registry:
    enabled: true
    name: apicurio-registry

    app:
      replicas: 2

      ingress:
        enabled: false
        host: ""
        ingressClassName: nginx
        annotations:
          nginx.org/proxy-connect-timeout: "30s"

      auth:
        enabled: true
        appClientId: registry-client-api
        uiClientId: registry-client-ui
        authServerUrl: https://keycloak.example.com/realms/registry
        redirectUri: https://registry-ui.example.com
        logoutUrl: https://registry-ui.example.com

    ui:
      enabled: true
      ingress:
        enabled: true
        host: ""
        ingressClassName: nginx
        annotations:
          nginx.org/proxy-connect-timeout: "30s"
        
    storage:
      type: postgresql
      sql:
        dataSource:
          url: jdbc:postgresql://postgresql.my-project.svc:5432/registry
          username: registry_user
          password:
            name: postgresql-credentials
            key: password

    resources:
      requests:
        cpu: 250m
        memory: 256Mi
      limits:
        cpu: 500m
        memory: 512Mi
