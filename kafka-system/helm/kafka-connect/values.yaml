clusterName: kafka-connect

nameOverride: connect

# Upstream Kafka cluster that Connect attaches to.
kafka:
  name: kafka-cluster
  namespace: kafka
  bootstrapPort: 9092
  # Cluster CA secret must exist in the Connect namespace when TLS is enabled.
  caSecretName: kafka-cluster-ca-cert

# 67. KafkaConnect schema reference
# docs: https://strimzi.io/docs/operators/latest/configuring.html#type-KafkaConnect-reference
connect:
  name: prod
  enabled: true
  version: "4.2.0"
  replicas: 3
  image: dockerhub.company.com.vn/bevisdev/kafka:4.2.0
  # to init connectors below
  useConnectorResources: true
  metadata:
    labels: {}
    annotations: {}

  # 74. KafkaClientAuthenticationScramSha512 schema reference
  # https://strimzi.io/docs/operators/latest/configuring.html#type-KafkaClientAuthenticationScramSha512-reference
  authentication:
    type: scram-sha-512
    username: connect
    passwordSecret:
      secretName: connect
      password: password

  tls:
    trustedCertificates:
      - secretName: dp-kafka-cluster-ca-cert
        certificate: ca.crt

  # docs: https://strimzi.io/docs/operators/latest/configuring.html#property-kafka-connect-additional-configuration-reference
  # additional: https://kafka.apache.org/41/configuration/kafka-connect-configs/
  config:
    config.storage.replication.factor: 3
    offset.storage.replication.factor: 3
    status.storage.replication.factor: 3

    # docs: https://kafka.apache.org/42/configuration/configuration-providers/
    # strimzi provider: https://strimzi.io/docs/operators/latest/full/deploying.html#assembly-loading-config-with-providers-str
    # to use providers, we have created role and rolebinding provider allows pod to get secrets, configmap
    config.providers: env,secrets,configmaps
    config.providers.env.class: org.apache.kafka.common.config.provider.EnvVarConfigProvider
    config.providers.secrets.class: io.strimzi.kafka.KubernetesSecretConfigProvider
    config.providers.configmaps.class: io.strimzi.kafka.KubernetesConfigMapConfigProvider

    # The value must be set lower than session.timeout.ms
    heartbeat.interval.ms: 5000
    rebalance.timeout.ms: 60000
    session.timeout.ms: 10000

  resources:
    requests:
      cpu: 2
      memory: 6Gi
      ephemeral-storage: 25Gi
    limits:
      cpu: 4
      memory: 8Gi
      ephemeral-storage: 40Gi

  jvmOptions:
    -Xms: 3g
    -Xmx: 3g
    # Iceberg/S3 buffer: Strimzi only allows mounts under /mnt; default /tmp is 5Mi tmpfs
    javaSystemProperties:
      - name: java.io.tmpdir
        value: /mnt/connect-tmp

  # 11.13.3. Configuring external logging
  # refer: https://strimzi.io/docs/operators/latest/deploying.html#con-external-logging-option_str
  # 1. Create a ConfigMap that contains a complete log4j2.properties file.
  # 2. Reference the ConfigMap in the spec.logging property of the custom resource.
  # Strimzi logging:
  # - type: inline -> text PatternLayout, only change root Level + loggers
  # - type: external (no valueFrom) -> automatic created ConfigMap JSON with config in `loggers` key
  logging:
    type: external
    timezone: Asia/Ho_Chi_Minh
    loggers:
      rootLogger.level: INFO

      # CDC / Connect
      io.debezium: INFO
      org.apache.kafka.connect.runtime: INFO
      org.apache.kafka.connect.runtime.errors: WARN
      org.apache.kafka.connect.runtime.rest: WARN
      org.apache.kafka.connect.storage: WARN
      org.apache.kafka.connect.transforms: WARN
      org.apache.iceberg: INFO

      # Kafka client
      org.apache.kafka: WARN
      org.apache.kafka.clients.NetworkClient: WARN
      org.apache.kafka.clients.consumer.internals: WARN
      org.apache.kafka.clients.producer.internals: WARN
      org.apache.kafka.common.network: WARN

      # HTTP / health probe
      org.eclipse.jetty: WARN
      org.eclipse.jetty.server: WARN
      org.apache.http: WARN

      # JDBC sink
      io.debezium.connector.jdbc: INFO
      com.zaxxer.hikari: WARN
      org.hibernate: WARN
      org.hibernate.SQL: WARN

      # misc
      io.netty: WARN
      org.reflections: ERROR
      org.apache.zookeeper: WARN


  # Build a custom image with connector plugins (Debezium, JDBC, S3, ...).
  # Requires Strimzi Cluster Operator with Kaniko/Buildah support.
  # docs: https://strimzi.io/docs/operators/latest/configuring.html#type-Build-reference
  # Build a custom image with connector plugins (Debezium, JDBC, S3, ...).
  #
  # build:
  #   # 80.1. Configuring container registries
  #   # docs: https://strimzi.io/docs/operators/latest/configuring.html#configuring_container_registries
  #   output:
  #     # supports: docker | imagestream
  #     type: docker
  #     image: dockerhub.company.com.vn/dwh/kafka-connect:4.2.0-debezium
  #     # use docker-registry k8s secrets with kubernetes.io/dockerconfigjson
  #     # docs: https://kubernetes.io/docs/tasks/configure-pod-container/pull-image-private-registry/#registry-secret-existing-credentials
  #     pushSecret: dockerhub-regcred

  #   # 80.2. Configuring connector plugins
  #   # docs: https://strimzi.io/docs/operators/latest/configuring.html#configuring_connector_plugins
  #   # Connector plugins are a set of files that define the implementation required to connect to certain types of external system
  #   plugins:
  #     - name: debezium-postgres
  #       artifacts:
  #         - type: tgz
  #           url: https://repo1.maven.org/maven2/io/debezium/debezium-connector-postgres/3.0.8.Final/debezium-connector-postgres-3.0.8.Final-plugin.tar.gz

  # Mount pre-built connector plugins from ConfigMap/Secret/EmptyDir.
  # 89. MountedPlugin schema reference
  # docs: https://strimzi.io/docs/operators/latest/configuring.html#type-MountedPlugin-reference
  # plugins: 
  #   - name: debezium-postgres
  #     artifacts:
  #       - type: image
  #         reference: dockerhub.../debezium-postgres-plugin:3.0.8
  #   - name: confluent-s3
  #     artifacts:
  #       - type: image
  #         reference: dockerhub.../confluent-s3-plugin:11.0.7
  
  # 78. KafkaConnectTemplate schema reference
  # docs: https://strimzi.io/docs/operators/latest/configuring#type-KafkaConnectTemplate-reference
  template:
    # 37. ContainerTemplate schema reference
    # docs: https://strimzi.io/docs/operators/latest/configuring#type-ContainerTemplate-reference
    # 
    # append secrets hosts, access-key..
    # if using EnvVarConfigProvider for connectors
    # connectContainer:
    #   env:
    #     - name: S3_ENDPOINT
    #       valueFrom:
    #         secretKeyRef:
    #           name: minio
    #           key: endpoint
    #     - name: S3_ACCESS_KEY
    #       valueFrom:
    #         secretKeyRef:
    #           name: minio
    #           key: access-key      
    #     - name: S3_SECRET_KEY
    #       valueFrom:
    #         secretKeyRef:
    #           name: minio
    #           key: secret-key
    pod:
      volumes:
        - name: connect-tmp
          emptyDir:
            sizeLimit: 30Gi
      imagePullSecrets:
        - name: dockerhub-regcred
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    strimzi.io/cluster: "{{ .Values.clusterName }}"
                    strimzi.io/kind: KafkaConnect
                topologyKey: kubernetes.io/hostname

    # https://strimzi.io/docs/operators/latest/configuring.html#con-common-configuration-volumes-reference
    # All additional mounted paths are located inside /mnt to ensure compatibility with future Kafka and Strimzi updates.
    connectContainer:
      volumeMounts:
        - name: connect-tmp
          mountPath: /mnt/connect-tmp
          
rbac:
  # create provider binding with user connect-sa which created by strimzi
  enabled: true

  # should enabled if using io.strimzi.kafka.KubernetesSecretConfigProvider
  # ${secrets:<namespace>/<secretname>:<key>}
  secretProvider:
    enabled: true
    
  # should enabled if using io.strimzi.kafka.KubernetesConfigMapConfigProvider
  configmapProvider:
    enabled: true

# Additional ingress policy for Kafka Connect REST API (:8083).
# Use this when clients (e.g. Kafbat in namespace `kafka`) need access,
# while keeping Strimzi-managed policy untouched.
connectApiAccessPolicy:
  enabled: true
  allowedNamespaces:
    - kafka
  # Optional namespace labels selector (advanced). If set, this overrides
  # allowedNamespaces for namespace-based matching.
  namespaceSelector: {}
  # Optional pod label selector (advanced). Usually not required.
  podSelector: {}
  port: 8083
  
# ---
# KafkaConnector - S3 Sink
# we use class `io.confluent.connect.s3.S3SinkConnector`
# docs: https://www.confluent.io/hub/confluentinc/kafka-connect-s3
s3: 
  - name: domain
    enabled: false
    config:
      topics.dir: cdc
      topics.regex: ^cdc\..*
      s3.bucket.name: prod-raw
      s3.part.size: 20971520 # 20MB
      s3.path.style.access: true
      aws.access.key.id: ${secrets:access-key}
      aws.secret.access.key: ${secrets:secret-key}
      store.url: ${secrets:endpoint}
      flush.size: "5"
      rotate.interval.ms: 300000 # 5min
      storage.class: io.confluent.connect.s3.storage.S3Storage
      # io.confluent.connect.s3.format.parquet.ParquetFormat
      format.class: io.confluent.connect.s3.format.avro.AvroFormat
      partitioner.class: io.confluent.connect.storage.partitioner.TimeBasedPartitioner
      partition.duration.ms: 3600000
      path.format: "YYYY-MM-dd/HH"
      locale: "en-US"
      timezone: "Asia/Ho_Chi_Minh"
      timestamp.extractor: Record
      timestamp.field: ts_ms
      behavior.on.null.values: ignore
      errors.tolerance: none

# ---
# Kafka Connector - Debeizum Connector
debezium: []

# ---
# KafkaConnector - Iceberg Sink
icebergs: 
  - name: oracle
    enabled: true
    tasksMax: 4
    autoRestart:
      enabled: true
      maxRestarts: 10
    config:
      topics.regex: ^cdc\.oracle\.(tbl1|tbl2)$

      key.converter: io.apicurio.registry.utils.converter.AvroConverter
      key.converter.schemas.enable: "false"
      key.converter.apicurio.registry.url: http://schema-registry-app-service.kafka.svc:8080/apis/registry/v3
      key.converter.apicurio.registry.artifact.group-id: groupId
      key.converter.apicurio.registry.auto-register: "false"
      key.converter.apicurio.registry.find-latest: "true"
      key.converter.apicurio.registry.as-confluent: "true"
      key.converter.apicurio.registry.headers.enabled: "false"
      key.converter.apicurio.use-id: contentId

      value.converter: io.apicurio.registry.utils.converter.AvroConverter
      value.converter.schemas.enable: "false"
      value.converter.apicurio.registry.url: http://schema-registry-app-service.kafka.svc:8080/apis/registry/v3
      value.converter.apicurio.registry.artifact.group-id: groupId
      value.converter.apicurio.registry.auto-register: "false"
      value.converter.apicurio.registry.find-latest: "true"
      value.converter.apicurio.registry.as-confluent: "true"
      value.converter.apicurio.registry.headers.enabled: "false"
      value.converter.apicurio.use-id: contentId

      iceberg.catalog.type: rest
      iceberg.catalog.uri: http://lakekeeper.lakekeeper.svc:8181/catalog
      iceberg.catalog.io-impl: org.apache.iceberg.aws.s3.S3FileIO
      iceberg.catalog.warehouse: lakehouse
      iceberg.catalog.s3.endpoint: ${secrets:minio:endpoint}
      iceberg.catalog.s3.access-key-id: ${secrets:minio:access-key}
      iceberg.catalog.s3.secret-access-key: ${secrets:minio:secret-key}
      iceberg.catalog.s3.path-style-access: true

      # Inject Kafka topic into record so route-field can map topic → Iceberg table
      transforms: debezium,kafkaMetadata
      transforms.debezium.type: org.apache.iceberg.connect.transforms.DebeziumTransform
      transforms.kafkaMetadata.type: org.apache.iceberg.connect.transforms.KafkaMetadataTransform
      transforms.kafkaMetadata.field_name: _kafka_metadata
      transforms.kafkaMetadata.nested: false

      iceberg.tables.dynamic-enabled: false
      iceberg.tables: >-
        raw.schema.tbl1,
        raw.schema.tbl2
      
      iceberg.tables.route-field: _kafka_metadata_topic
      iceberg.table.raw.schema.tbl1.route-regex: .*TBL1$
      iceberg.table.raw.schema.tbl1.partition-by: days(_cdc.ts)

      iceberg.table.raw.schema.tbl2.route-regex: .*TBL2$
      iceberg.table.raw.schema.tbl2.partition-by: days(_cdc.ts)

      iceberg.tables.auto-create-enabled: true
      iceberg.tables.evolve-schema-enabled: true
      iceberg.tables.schema-force-optional: true

      iceberg.catalog.rest.auth.type: oauth2
      iceberg.catalog.oauth2-server-uri: https://login.microsoftonline.com/<tenant-id>/oauth2/v2.0/token
      iceberg.catalog.credential: ${secrets:etl:client-id}:${secrets:etl:secret-key}
      iceberg.catalog.scope: api://<app-id>/.default
      iceberg.catalog.token-exchange-enabled: "false"
      iceberg.catalog.token-refresh-enabled: "true"

      # Coordinator
      iceberg.control.group-id-prefix: connect-control-
      iceberg.control.topic: __control.uat.oracle
      iceberg.control.commit.interval-ms: 60000

      errors.tolerance: none


# KafkaConnector CRs. Requires connect.useConnectorResources: true.
# 122. KafkaConnector schema reference
# docs: https://strimzi.io/docs/operators/latest/configuring.html#type-KafkaConnector-reference
# CONVENTION:
#   name: metadata resource name (DNS-safe)
#   connector.class: fully qualified connector class
# --- Connector name
# recommend: cdc-<env>-s3-sink
connectors:
# ==========================
# ===== CDC ORACLE =========
# ==========================
  - name: cdc-oracle
    enabled: true
    state: running
    class: io.debezium.connector.oracle.OracleConnector
    autoRestart:
      enabled: true
      maxRestarts: 10
    config:
      database.hostname: ${secrets:oracle/host}
      database.port: 1521
      database.user: ${secrets:oracle/username}
      database.password: ${secrets:oracle/password}
      database.dbname: ${secrets:oracle/dbname}
      # database.pdb.name: ORCLPDB1
      # default: logminer
      # logminer | logminer_unbuffered | OpenLogReplicator (need install OpenLogReplicator) | xstream (GoldenGate)
      database.connection.adapter: logminer

      # prefix append for tables
      topic.prefix: cdc.oracle
      schema.include.list: CORE,AUTH
      table.include.list: >-
        CORE.CUSTOMERS,
        CORE.ORDERS,
        AUTH.USERS

      log.mining.strategy: online_catalog
      
      # snapshot mode
      # default: initial
      snapshot.mode: initial
      snapshot.database.errors.max.retries: "3"

      heartbeat.interval.ms: "60000"
      topic.heartbeat.prefix: __heartbeat.prod

      schema.name.adjustment.mode: avro
      key.converter: io.apicurio.registry.utils.converter.AvroConverter
      key.converter.schemas.enable: "false"
      key.converter.apicurio.registry.artifact.group-id: groupdId
      key.converter.apicurio.registry.url: http://schema-registry-app-service.kafka.svc:8080/apis/registry/v3
      key.converter.apicurio.registry.auto-register: "true"
      key.converter.apicurio.registry.find-latest: "true"
      key.converter.apicurio.registry.as-confluent: "true"
      key.converter.apicurio.registry.headers.enabled: "false"
      key.converter.apicurio.use-id: contentId

      value.converter.apicurio.registry.artifact.group-id: groupdId
      value.converter: io.apicurio.registry.utils.converter.AvroConverter
      value.converter.schemas.enable: "false"
      value.converter.apicurio.registry.url: http://schema-registry-app-service.kafka.svc:8080/apis/registry/v3
      value.converter.apicurio.registry.auto-register: "true"
      value.converter.apicurio.registry.find-latest: "true"
      value.converter.apicurio.registry.as-confluent: "true"
      value.converter.apicurio.registry.headers.enabled: "false"
      value.converter.apicurio.use-id: contentId

      # watch signal from signal kafka topic
      # purpose: ad-hoc snapshot table
      # By default, a connector runs an initial snapshot operation only after it starts for first time
      # ---
      # You specify the tables to capture by sending an `execute-snapshot` message to the signaling table.
      # example message using the Kafka signaling channel to trigger
      # key: must match the value of the `topic.prefix` connector configuration option.
      # {"type":"execute-snapshot","data":{"data-collections":["MAIN.ACC_BALANCE"],"type":"incremental"}}
      # spec:
      # type: execute-snapshot
      # data.type: incremental | blocking
      # data.data-collections: specify table names by using the format database.schema.table.
      # ---
      # channels: source | kafka | file | jmx (optional)
      signal.enabled.channels: source,kafka
      signal.data.collection: DB.SCHEMA.TABLE1
      signal.kafka.groupId: signal-prod-domain
      signal.kafka.topic: __signal.prod.domain
      signal.kafka.poll.timeout.ms: "500"
      signal.kafka.bootstrap.servers: kafka-cluster-kafka-bootstrap.kafka.svc:9092
      signal.consumer.security.protocol: SASL_SSL
      signal.consumer.sasl.mechanism: SCRAM-SHA-512
      signal.consumer.sasl.jaas.config: ${secrets:connect:sasl.jaas.config}
      signal.consumer.ssl.truststore.type: PEM
      signal.consumer.ssl.truststore.certificates: ${secrets:dp-kafka-cluster-ca-cert:ca_cert}
      signal.consumer.request.timeout.ms: "60000"
      signal.consumer.default.api.timeout.ms: "120000"
      signal.consumer.connections.max.idle.ms: "540000"

      # schema history internal
      schema.history.internal.kafka.topic: __history.oracle
      schema.history.internal.kafka.bootstrap.servers: dp-kafka-kafka-bootstrap.kafka.svc:9092
      schema.history.internal.store.only.captured.tables.ddl: false

      # ====== PRODUCER
      # schema history internal producer using SASL
      schema.history.internal.producer.security.protocol: SASL_SSL
      schema.history.internal.producer.sasl.mechanism: SCRAM-SHA-512
      schema.history.internal.producer.sasl.jaas.config: ${secrets:connect:sasl.jaas.config}
      schema.history.internal.producer.ssl.truststore.type: PEM
      schema.history.internal.producer.ssl.truststore.certificates: ${secrets:dp-kafka-cluster-ca-cert:ca_cert}

      # ====== CONSUMER
      # schema history internal consumer using SASL
      schema.history.internal.consumer.security.protocol: SASL_SSL
      schema.history.internal.consumer.sasl.mechanism: SCRAM-SHA-512
      schema.history.internal.consumer.sasl.jaas.config: ${secrets:connect:sasl.jaas.config}
      schema.history.internal.consumer.ssl.truststore.type: PEM
      schema.history.internal.consumer.ssl.truststore.certificates: ${secrets:dp-kafka-cluster-ca-cert:ca_cert}

      errors.tolerance: none
      errors.log.enable: true
      errors.log.include.messages: false
      errors.retry.timeout: "-1"
      errors.retry.delay.max.ms: "60000"

      # event format
      # decimal handling mode
      # default: false
      # if run ALTER TABLE CUSTOMERS ADD EMAIL VARCHAR2(100); no send event to kafka
      include.schema.changes: false
      tombstones.on.delete: false
      
      # format
      decimal.handling.mode: precise
      time.precision.mode: adaptive

  - name: jdbc-oracle-to-oracle
    enabled: false
    class: io.debezium.connector.jdbc.JdbcSinkConnector
    tasksMax: 2
    autoRestart:
      enabled: true
      maxRestarts: 10
    config:
      consumer.override.partition.assignment.strategy: org.apache.kafka.clients.consumer.StickyAssignor
      topics.regex: >-
        ^cdc\.prod\.domain\.SCHEMA\.(TBL1|TBL2)$
      
      connection.url: >-
        jdbc:oracle:thin:@//${secrets:user:host}:${secrets:user:port}/${secrets:user:service}
      connection.username: ${secrets:user:username}
      connection.password: ${secrets:user:password}
      connection.pool.min_size: "8"
      connection.pool.max_size: "32"
      connection.restart.on.errors: "true"
      
      insert.mode: upsert
      delete.enabled: "true"
      truncate.enabled: "false"
      
      primary.key.mode: record_key
      schema.evolution: none
      quote.identifiers: "false"
      use.time.zone: Asia/Ho_Chi_Minh
      collection.name.format: "${source.schema}.${source.table}"
      batch.size: "1000"

      key.converter: io.apicurio.registry.utils.converter.AvroConverter
      key.converter.schemas.enable: "false"
      key.converter.apicurio.registry.artifact.group-id: groupId
      key.converter.apicurio.registry.url: http://schema-registry-app-service.kafka.svc:8080/apis/registry/v3
      key.converter.apicurio.registry.auto-register: "false"
      key.converter.apicurio.registry.find-latest: "true"
      key.converter.apicurio.registry.as-confluent: "true"
      key.converter.apicurio.registry.headers.enabled: "false"
      key.converter.apicurio.use-id: contentId

      value.converter.apicurio.registry.artifact.group-id: groupId
      value.converter: io.apicurio.registry.utils.converter.AvroConverter
      value.converter.schemas.enable: "false"
      value.converter.apicurio.registry.url: http://schema-registry-app-service.kafka.svc:8080/apis/registry/v3
      value.converter.apicurio.registry.auto-register: "false"
      value.converter.apicurio.registry.find-latest: "true"
      value.converter.apicurio.registry.as-confluent: "true"
      value.converter.apicurio.registry.headers.enabled: "false"
      value.converter.apicurio.use-id: contentId

      errors.tolerance: none
      errors.log.enable: true
      errors.log.include.messages: false
      errors.retry.timeout: "-1"
      errors.retry.delay.max.ms: "60000"

      hibernate.connection.driver_class: oracle.jdbc.OracleDriver