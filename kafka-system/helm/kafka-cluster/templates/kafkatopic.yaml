{{- $root := . }}
{{- range .Values.topics }}
{{- if .enabled }}
---
apiVersion: kafka.strimzi.io/v1
kind: KafkaTopic
metadata:
  name: {{ include "topic.metadataName" (required "topics[].name is required" .name) }}
  labels:
    {{- include "kafka.labels" $root }}
  {{- with .annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  topicName: {{ required "topicName is required" .topicName | quote }}
  {{- with .partitions }}
  partitions: {{ . }}
  {{- end }}
  {{- with .replicas }}
  replicas: {{ . }}
  {{- end }}
  {{- with .config }}
  config:
    {{- toYaml . | nindent 4 }}
  {{- end }}
{{- end }}
{{- end }}