stages:
  - register

variables:
  REGISTRY_URL: "https://schema-registry.example.com/apis/registry/v3"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  SKIP_CONFIG_SYNC: "1"

register_schemas:
  stage: register
  tags:
    - build
  before_script:
    - pip install --quiet pyyaml
  script:
    - python main.py
  when: manual
  only:
    - master
