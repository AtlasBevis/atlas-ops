# SQL Server → Debezium 3.6 → Avro
# https://debezium.io/documentation/reference/3.6/connectors/sqlserver.html#sqlserver-data-types
#
# Defaults: decimal.handling.mode=precise, time.precision.mode=adaptive,
# binary.handling.mode=bytes
# First matching rule wins. Avro has no INT16 → use int.
# TIMESTAMP is a ROWVERSION synonym, not a temporal type.

rules:
  # --- boolean ---
  - source_types: [BIT]
    avro_ref: boolean

  # --- integers ---
  - source_types: [TINYINT]
    avro_ref: int
  - source_types: [SMALLINT]
    avro_ref: int
  - source_types: [INT, INTEGER]
    avro_ref: int
  - source_types: [BIGINT]
    avro_ref: long

  # --- floating ---
  - source_types: [REAL]
    avro_ref: float
  - source_types: [FLOAT]
    avro_ref: double

  # --- decimal / money ---
  - source_types: [NUMERIC, DECIMAL, DEC]
    avro_ref: decimal
  - source_types: [SMALLMONEY]
    avro_ref: decimal
    extra:
      precision: 10
      scale: 4
      connect.parameters:
        scale: "4"
        connect.decimal.precision: "10"
  - source_types: [MONEY]
    avro_ref: decimal
    extra:
      precision: 19
      scale: 4
      connect.parameters:
        scale: "4"
        connect.decimal.precision: "19"

  # --- character / text ---
  - source_types:
      - CHAR
      - VARCHAR
      - TEXT
      - NCHAR
      - NVARCHAR
      - NTEXT
    avro_ref: string

  # --- binary ---
  - source_types: [BINARY, VARBINARY, IMAGE]
    avro_ref: bytes

  # --- xml / guid ---
  - source_types: [XML]
    avro_ref: xml
  - source_types: [UNIQUEIDENTIFIER]
    avro_ref: uuid

  # --- temporal with timezone ---
  - source_types: [DATETIMEOFFSET]
    avro_ref: zoned_timestamp

  # --- temporal adaptive ---
  - source_types: [DATE]
    avro_ref: date_days

  - source_types: [TIME]
    when: { fractional_seconds: { lte: 3 } }
    avro_ref: time_ms
  - source_types: [TIME]
    when: { fractional_seconds: { lte: 6 } }
    avro_ref: micro_time
  - source_types: [TIME]
    avro_ref: nano_time

  - source_types: [DATETIME, SMALLDATETIME]
    avro_ref: timestamp_ms

  - source_types: [DATETIME2]
    when: { fractional_seconds: { lte: 3 } }
    avro_ref: timestamp_ms
  - source_types: [DATETIME2]
    when: { fractional_seconds: { lte: 6 } }
    avro_ref: timestamp_us
  - source_types: [DATETIME2]
    avro_ref: timestamp_ns

  # --- not supported ---
  - source_types: [GEOGRAPHY, GEOMETRY, HIERARCHYID, SQL_VARIANT, ROWVERSION, TIMESTAMP]
    supported: false
