# MySQL → Debezium 3.6 → Avro
# https://debezium.io/documentation/reference/3.6/connectors/mysql.html#mysql-data-types
#
# Defaults: decimal.handling.mode=precise, time.precision.mode=adaptive_time_microseconds,
# binary.handling.mode=bytes
# First matching rule wins. Avro has no INT16 → use int.

rules:
  # --- boolean / bits ---
  - source_types: [BOOLEAN, BOOL]
    avro_ref: boolean
  - source_types: [BIT]
    when: { length: { lte: 1 } }
    avro_ref: boolean
  - source_types: [BIT]
    when: { length: { defined: false } }
    avro_ref: boolean
  - source_types: [BIT]
    avro_ref: bits

  # --- integers ---
  - source_types: [TINYINT]
    avro_ref: int
  - source_types: [SMALLINT]
    avro_ref: int
  - source_types: [MEDIUMINT]
    avro_ref: int
  - source_types: [INT, INTEGER]
    avro_ref: int
  - source_types: [BIGINT]
    avro_ref: long

  # --- floating ---
  - source_types: [FLOAT]
    when: { precision: { lte: 23 } }
    avro_ref: float
  - source_types: [FLOAT]
    when: { precision: { defined: true } }
    avro_ref: double
  - source_types: [FLOAT]
    avro_ref: float
  - source_types: [REAL]
    avro_ref: float
  - source_types: [DOUBLE, "DOUBLE PRECISION"]
    avro_ref: double

  # --- decimal / numeric ---
  - source_types: [DECIMAL, NUMERIC, DEC, FIXED]
    avro_ref: decimal

  # --- character / text ---
  - source_types: [CHAR, VARCHAR, TINYTEXT, TEXT, MEDIUMTEXT, LONGTEXT]
    avro_ref: string

  # --- binary / blob ---
  - source_types:
      - BINARY
      - VARBINARY
      - TINYBLOB
      - BLOB
      - MEDIUMBLOB
      - LONGBLOB
    avro_ref: bytes

  # --- json / enum / set / year ---
  - source_types: [JSON]
    avro_ref: json
  - source_types: [ENUM]
    avro_ref: enum
  - source_types: [SET]
    avro_ref: enum_set
  - source_types: [YEAR]
    avro_ref: year

  # --- temporal ---
  - source_types: [TIMESTAMP]
    avro_ref: zoned_timestamp

  - source_types: [DATE]
    avro_ref: date_days

  - source_types: [TIME]
    avro_ref: micro_time

  - source_types: [DATETIME]
    when: { fractional_seconds: { lte: 3 } }
    avro_ref: timestamp_ms
  - source_types: [DATETIME]
    when: { fractional_seconds: { defined: true } }
    avro_ref: timestamp_us
  - source_types: [DATETIME]
    avro_ref: timestamp_ms

  # --- spatial / vector ---
  - source_types:
      - GEOMETRY
      - POINT
      - LINESTRING
      - POLYGON
      - MULTIPOINT
      - MULTILINESTRING
      - MULTIPOLYGON
      - GEOMETRYCOLLECTION
    avro_ref: geometry
  - source_types: [VECTOR]
    avro_ref: float_vector
