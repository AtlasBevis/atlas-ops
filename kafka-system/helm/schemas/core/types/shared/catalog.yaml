# Shared Avro / Kafka Connect field types for Schema Registry generation.
# Keys are referenced by avro_ref in each connector's mappings.yaml.
#
# Primitive + Connect logical types are inlined on the field.
# Named records with register: true are registered once (group debezium)
# and referenced from table schemas via Apicurio artifact references.

connect_version: 1

# --- primitives (Kafka Connect literal → Avro) ---
string:
  type: string

int:
  type: int

long:
  type: long

float:
  type: float

double:
  type: double

bytes:
  type: bytes

boolean:
  type: boolean

# --- Connect / Debezium logical types (inline on field) ---
decimal:
  type: bytes
  logicalType: decimal
  connect.name: org.apache.kafka.connect.data.Decimal
  connect.version: 1
  # precision / scale: set per column from source metadata

date_days:
  type: int
  connect.name: io.debezium.time.Date
  connect.version: 1
  doc: Days since UNIX epoch.

connect_date:
  type: int
  connect.name: org.apache.kafka.connect.data.Date
  connect.version: 1
  doc: Days since UNIX epoch (time.precision.mode=connect).

time_ms:
  type: int
  connect.name: io.debezium.time.Time
  connect.version: 1
  doc: Milliseconds past midnight; no timezone.

micro_time:
  type: long
  connect.name: io.debezium.time.MicroTime
  connect.version: 1
  doc: Microseconds past midnight; no timezone.

nano_time:
  type: long
  connect.name: io.debezium.time.NanoTime
  connect.version: 1
  doc: Nanoseconds past midnight; no timezone.

connect_time:
  type: long
  connect.name: org.apache.kafka.connect.data.Time
  connect.version: 1
  doc: Milliseconds past midnight (time.precision.mode=connect).

timestamp_ms:
  type: long
  connect.name: io.debezium.time.Timestamp
  connect.version: 1
  doc: Milliseconds since UNIX epoch; no timezone.

timestamp_us:
  type: long
  connect.name: io.debezium.time.MicroTimestamp
  connect.version: 1
  doc: Microseconds since UNIX epoch; no timezone.

timestamp_ns:
  type: long
  connect.name: io.debezium.time.NanoTimestamp
  connect.version: 1
  doc: Nanoseconds since UNIX epoch; no timezone.

connect_timestamp:
  type: long
  connect.name: org.apache.kafka.connect.data.Timestamp
  connect.version: 1
  doc: Milliseconds since UNIX epoch (time.precision.mode=connect).

zoned_timestamp:
  type: string
  connect.name: io.debezium.time.ZonedTimestamp
  connect.version: 1
  doc: ISO-8601 timestamp with timezone (typically GMT/UTC).

zoned_time:
  type: string
  connect.name: io.debezium.time.ZonedTime
  connect.version: 1
  doc: ISO-8601 time with timezone (typically GMT/UTC).

year:
  type: int
  connect.name: io.debezium.time.Year
  connect.version: 1

micro_duration:
  type: double
  connect.name: io.debezium.time.MicroDuration
  connect.version: 1
  doc: Approximate microseconds for an interval.

interval_string:
  type: string
  connect.name: io.debezium.time.Interval
  connect.version: 1
  doc: PnYnMnDTnHnMnS when interval.handling.mode=string.

# --- Debezium semantic string/bytes wrappers ---
json:
  type: string
  connect.name: io.debezium.data.Json
  connect.version: 1

xml:
  type: string
  connect.name: io.debezium.data.Xml
  connect.version: 1

uuid:
  type: string
  connect.name: io.debezium.data.Uuid
  connect.version: 1

enum:
  type: string
  connect.name: io.debezium.data.Enum
  connect.version: 1
  # connect.parameters.allowed: comma-separated values (set per column)

enum_set:
  type: string
  connect.name: io.debezium.data.EnumSet
  connect.version: 1
  # connect.parameters.allowed: comma-separated values (set per column)

bits:
  type: bytes
  connect.name: io.debezium.data.Bits
  connect.version: 1
  # connect.parameters.length: bit length (set per column)

ltree:
  type: string
  connect.name: io.debezium.data.Ltree
  connect.version: 1

tsvector:
  type: string
  connect.name: io.debezium.data.Tsvector
  connect.version: 1

# --- Named records registered once in group debezium ---
variable_scale_decimal:
  register: true
  group: debezium
  artifact: VariableScaleDecimal
  connect.name: io.debezium.data.VariableScaleDecimal
  connect.version: 1
  schema:
    type: record
    name: VariableScaleDecimal
    namespace: io.debezium.data
    connect.name: io.debezium.data.VariableScaleDecimal
    connect.version: 1
    fields:
      - name: scale
        type: int
      - name: value
        type: bytes

point:
  register: true
  group: debezium
  artifact: Point
  connect.name: io.debezium.data.geometry.Point
  connect.version: 1
  schema:
    type: record
    name: Point
    namespace: io.debezium.data.geometry
    connect.name: io.debezium.data.geometry.Point
    connect.version: 1
    fields:
      - name: x
        type: double
      - name: y
        type: double

geometry:
  register: true
  group: debezium
  artifact: Geometry
  connect.name: io.debezium.data.geometry.Geometry
  connect.version: 1
  schema:
    type: record
    name: Geometry
    namespace: io.debezium.data.geometry
    connect.name: io.debezium.data.geometry.Geometry
    connect.version: 1
    fields:
      - name: srid
        type: ["null", "int"]
        default: null
      - name: wkb
        type: bytes

geography:
  register: true
  group: debezium
  artifact: Geography
  connect.name: io.debezium.data.geometry.Geography
  connect.version: 1
  schema:
    type: record
    name: Geography
    namespace: io.debezium.data.geometry
    connect.name: io.debezium.data.geometry.Geography
    connect.version: 1
    fields:
      - name: srid
        type: ["null", "int"]
        default: null
      - name: wkb
        type: bytes
