# PostgreSQL → Debezium → Avro (Schema Registry)
# Doc: https://debezium.io/documentation/reference/stable/connectors/postgresql.html#postgresql-data-types
#
# Generator:
#   1. Load this file
#   2. Match column against mappings.yaml (first rule wins)
#   3. Resolve avro_ref from shared/catalog.yaml
#   4. If column.nullable: wrap ["null", <type>] with default null

connector: postgres
documentation: https://debezium.io/documentation/reference/stable/connectors/postgresql.html#postgresql-data-types

defaults:
  decimal.handling.mode: precise
  time.precision.mode: adaptive
  interval.handling.mode: numeric
  binary.handling.mode: bytes
  hstore.handling.mode: json

files:
  catalog: types/shared/catalog.yaml
  mappings: types/postgres/mappings.yaml
