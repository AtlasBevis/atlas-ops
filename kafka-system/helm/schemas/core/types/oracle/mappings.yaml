# Oracle → Debezium 3.6 → Avro
# https://debezium.io/documentation/reference/3.6/connectors/oracle.html#oracle-data-type-mappings
#
# Defaults: decimal.handling.mode=precise, time.precision.mode=adaptive,
# interval.handling.mode=numeric, binary.handling.mode=bytes
# First matching rule wins. Avro has no INT8/INT16 → use int.

rules:
  # --- character ---
  - source_types: [CHAR, NCHAR, NVARCHAR2, VARCHAR, VARCHAR2]
    avro_ref: string

  # --- LOB / binary ---
  - source_types: [CLOB, NCLOB]
    avro_ref: string
  - source_types: [BLOB, RAW]
    avro_ref: bytes
  - source_types: [BFILE, LONG, UROWID, BOOLEAN, VECTOR]
    supported: false
  - source_types: ["LONG RAW"]
    supported: false

  # --- numeric ---
  - source_types: [BINARY_FLOAT]
    avro_ref: float
  - source_types: [BINARY_DOUBLE]
    avro_ref: double

  # NUMBER/DECIMAL/NUMERIC with scale > 0 → Decimal
  - source_types: [NUMBER, DECIMAL, NUMERIC]
    when: { scale: { gt: 0 } }
    avro_ref: decimal

  # NUMBER(P, S<=0) integer width from (P - S); DECIMAL/NUMERIC S defaults to 0
  - source_types: [NUMBER, DECIMAL, NUMERIC]
    when: { scale: { lte: 0 }, p_minus_s: { lt: 3 } }
    avro_ref: int
  - source_types: [NUMBER, DECIMAL, NUMERIC]
    when: { scale: { lte: 0 }, p_minus_s: { lt: 5 } }
    avro_ref: int
  - source_types: [NUMBER, DECIMAL, NUMERIC]
    when: { scale: { lte: 0 }, p_minus_s: { lt: 10 } }
    avro_ref: int
  - source_types: [NUMBER, DECIMAL, NUMERIC]
    when: { scale: { lte: 0 }, p_minus_s: { lt: 19 } }
    avro_ref: long
  - source_types: [NUMBER, DECIMAL, NUMERIC]
    when: { scale: { lte: 0 }, p_minus_s: { gte: 19 } }
    avro_ref: decimal

  # NUMBER / DECIMAL / NUMERIC without scale (NUMBER, NUMBER(P,*))
  - source_types: [NUMBER, DECIMAL, NUMERIC]
    avro_ref: variable_scale_decimal

  # INTEGER / INT / SMALLINT = NUMBER(38,0)
  - source_types: [INTEGER, INT, SMALLINT]
    avro_ref: decimal

  - source_types: ["DOUBLE PRECISION", FLOAT, REAL]
    avro_ref: variable_scale_decimal

  # --- temporal (time.precision.mode=adaptive) ---
  - source_types: [DATE]
    avro_ref: timestamp_ms

  - source_types: [TIMESTAMP]
    when: { fractional_seconds: { lte: 3 } }
    avro_ref: timestamp_ms
  - source_types: [TIMESTAMP]
    when: { fractional_seconds: { lte: 6 } }
    avro_ref: timestamp_us
  - source_types: [TIMESTAMP]
    when: { fractional_seconds: { defined: true } }
    avro_ref: timestamp_ns
  - source_types: [TIMESTAMP]
    avro_ref: timestamp_us

  - source_types: ["TIMESTAMP WITH TIME ZONE", "TIMESTAMP WITH LOCAL TIME ZONE"]
    avro_ref: zoned_timestamp

  - source_types: ["INTERVAL DAY TO SECOND", "INTERVAL YEAR TO MONTH", INTERVALDS, INTERVALYM]
    avro_ref: micro_duration

  # --- rowid / xml ---
  - source_types: [ROWID]
    avro_ref: string
  - source_types: [XMLTYPE]
    avro_ref: xml

  # --- not supported ---
  - source_types:
      - SDO_GEOMETRY
      - ANYDATA
      - OBJECT
      - REF
      - VARRAY
      - TABLE
    supported: false
