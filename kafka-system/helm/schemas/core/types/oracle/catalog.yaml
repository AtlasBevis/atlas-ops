# Reusable Avro field types for Schema Registry / table .avsc generation.
# keyed by avro_ref in mappings.yaml
#
# Primitive + Connect logical types are inlined on the field.
# Named records (variable_scale_decimal) can be registered once in group debezium.

connect_version: 1

# --- primitives (Kafka Connect literal → Avro) ---
string:
  type: string

int:
  type: int

long:
  type: long

float:
  type: float

double:
  type: double

bytes:
  type: bytes

boolean:
  type: boolean

# --- Connect logical types (inline on field) ---
decimal:
  type: bytes
  logicalType: decimal
  connect.name: org.apache.kafka.connect.data.Decimal
  connect.version: 1
  # precision / scale: set per column (NUMBER(p,s))

timestamp_ms:
  type: long
  connect.name: io.debezium.time.Timestamp
  connect.version: 1
  doc: Milliseconds since UNIX epoch; no timezone.

timestamp_us:
  type: long
  connect.name: io.debezium.time.MicroTimestamp
  connect.version: 1
  doc: Microseconds since UNIX epoch; no timezone.

timestamp_ns:
  type: long
  connect.name: io.debezium.time.NanoTimestamp
  connect.version: 1
  doc: Nanoseconds since UNIX epoch; no timezone.

zoned_timestamp:
  type: string
  connect.name: io.debezium.time.ZonedTimestamp
  connect.version: 1

date_days:
  type: int
  connect.name: org.apache.kafka.connect.data.Date
  connect.version: 1
  doc: Days since UNIX epoch (time.precision.mode=connect only).

connect_timestamp:
  type: long
  connect.name: org.apache.kafka.connect.data.Timestamp
  connect.version: 1
  doc: Milliseconds since UNIX epoch (time.precision.mode=connect).

micro_duration:
  type: double
  connect.name: io.debezium.time.MicroDuration
  connect.version: 1

interval_string:
  type: string
  connect.name: io.debezium.time.Interval
  connect.version: 1
  doc: PnYnMnDTnHnMnS when interval.handling.mode=string.

# Register once (group debezium), then reference from table schemas.
variable_scale_decimal:
  register: true
  group: debezium
  artifact: VariableScaleDecimal
  connect.name: io.debezium.data.VariableScaleDecimal
  connect.version: 1
  schema:
    type: record
    name: VariableScaleDecimal
    namespace: io.debezium.data
    connect.name: io.debezium.data.VariableScaleDecimal
    connect.version: 1
    fields:
      - name: scale
        type: int
      - name: value
        type: bytes
