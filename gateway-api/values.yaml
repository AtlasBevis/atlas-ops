# gateway-api — declarative Gateway / HTTPRoute / GRPCRoute for apps behind
# a shared Envoy Gateway (or any Gateway API implementation).
#
# Standard steps to onboard a new cluster / new host:
#   1. Set `gatewayClassName` to the GatewayClass your controller created
#      (e.g. Envoy Gateway chart's `gatewayClass.name`).
#   2. Fill in exactly one entry under `gateways` — this is the single
#      shared Gateway that claims the LoadBalancer VIP. One Gateway is
#      enough for many hosts; don't create a second one per app.
#   3. Point `defaultParentRefs` at that Gateway so routes below don't
#      need to repeat parentRefs every time.
#   4. Add one entry per host under `httpRoutes` (`grpcRoutes` for gRPC, or
#      `tlsRoutes` for raw TCP+TLS backends like Kafka). Copy the example
#      block, change name/hostnames/backendRefs.
#   5. Only add a `referenceGrants` entry if the backend Service lives in a
#      different namespace than its HTTPRoute/GRPCRoute.
#   6. Add `sessionAffinity` on a route only if its backend has >1 replica
#      AND holds per-connection/session state (in-memory auth session,
#      SSE/long-poll, sticky cache, ...). Skip it for stateless backends.
#   7. helm lint . && helm template . | less   # sanity check before apply/sync
#
# Nothing is created if you leave the lists empty — uncomment/copy the
# examples below as needed.

# -- Step 1: GatewayClass every Gateway/route uses unless it sets its own.
gatewayClassName: "data-gateway"
# gatewayClassName: eg

# -- Step 3: parentRefs every HTTPRoute/GRPCRoute uses unless it sets its
# own `parentRefs` list. Point this at the shared Gateway from step 2.
defaultParentRefs:
  - name: data-gw
    namespace: gateway-api

# -- Step 2: Gateways to create. Usually exactly one per VIP/environment —
# the EnvoyProxy (or equivalent) behind `gatewayClassName` pins the
# LoadBalancer IP; this Gateway is what actually opens listeners and claims
# that Service.
gateways:
  - name: data-gw
    namespace: gateway-api
    listeners:
      - name: http
        protocol: HTTP
        port: 80
        allowedRoutes:
          namespaces:
            from: All
      # TLS passthrough listener for non-HTTP TCP+TLS traffic on the SAME VIP
      # (e.g. Kafka via the Strimzi `type: cluster-ip` listener — see
      # kafka-system/helm/kafka-cluster/values.yaml). The proxy never decrypts;
      # it forwards raw TLS bytes to the Service its TLSRoute selects, so the
      # backend keeps owning its certificate.
      #
      # Kafka clients reconnect straight to the partition leader, so every broker
      # needs a distinct endpoint. Each one has its OWN hostname, so the TLS SNI
      # distinguishes them and a single port is enough. Do NOT set `hostname`
      # here: that would pin the listener to one name, while it has to serve all
      # of them — the TLSRoutes below do the hostname matching.
      # Only 9094 needs opening on the L4 proxy, and a new broker costs a DNS
      # record rather than a new port.
      - name: kafka-tls
        protocol: TLS
        port: 9094
        tls:
          mode: Passthrough
        allowedRoutes:
          namespaces:
            from: All
          kinds:
            - kind: TLSRoute

      # ALTERNATIVE — ONE hostname, one port per endpoint. Replaces the listener
      # above with four, since identical SNI forces the Gateway to tell the
      # endpoints apart by port. Ports MUST match
      # `configuration.brokers[].advertisedPort` in the Kafka chart, and all four
      # must be open on the L4 proxy.
      # - name: kafka-bootstrap
      #   protocol: TLS
      #   port: 9094
      #   hostname: kafka.example.local
      #   tls:
      #     mode: Passthrough
      #   allowedRoutes:
      #     namespaces:
      #       from: All
      #     kinds:
      #       - kind: TLSRoute
      # - name: kafka-broker-3          # then -4 on 19094, -5 on 19095
      #   protocol: TLS
      #   port: 19093
      #   hostname: kafka.example.local
      #   tls:
      #     mode: Passthrough
      #   allowedRoutes:
      #     namespaces:
      #       from: All
      #     kinds:
      #       - kind: TLSRoute
      # Add once a TLS secret exists in gateway-api (or grant
      # cross-namespace access via referenceGrants below):
      # - name: https
      #   protocol: HTTPS
      #   port: 443
      #   tls:
      #     mode: Terminate
      #     certificateRefs:
      #       - name: wildcard-vietcredit-tls
      #   allowedRoutes:
      #     namespaces:
      #       from: All

# -- Step 4: HTTPRoutes. Each entry becomes one HTTPRoute object.
#
# Shorthand (most apps): set `path`/`pathType`/`backendRefs`, a single rule
# is generated. Full control: set `rules` (raw Gateway API HTTPRouteRule
# list) and it's used as-is instead.
httpRoutes: []
# httpRoutes:
#   - name: example-app
#     namespace: example-app
#     hostnames:
#       - example-app.example.local
#     # parentRefs: []           # optional override of defaultParentRefs
#     # path: "/"                # default
#     # pathType: PathPrefix     # default
#     backendRefs:
#       - name: example-app-svc
#         port: 80
#     # Optional: cookie-based session affinity (renders a
#     # BackendTrafficPolicy targeting this route). Only needed when the
#     # backend has >1 replica and keeps per-session state.
#     # sessionAffinity:
#     #   cookieName: example-app-affinity
#     #   ttl: 48h   # Max-Age of the generated cookie, e.g. 2 days.
#     #              # Must match ^([0-9]{1,5}(h|m|s|ms)){1,4}$ — max 5
#     #              # digits per unit, so use "48h" not "172800s".
#
#   # Advanced example using full `rules` passthrough (weighted split,
#   # header match, path rewrite filter, ...):
#   - name: example-app-canary
#     namespace: example-app
#     hostnames:
#       - example-app.example.local
#     rules:
#       - matches:
#           - path:
#               type: PathPrefix
#               value: /
#         backendRefs:
#           - name: example-app-stable
#             port: 80
#             weight: 90
#           - name: example-app-canary
#             port: 80
#             weight: 10

# -- Step 4 (gRPC): GRPCRoutes. Same shape as httpRoutes but for gRPC
# services.
#
# Requirements on the backend Service for gRPC to work through the
# gateway:
#   - Service port must set `appProtocol: kubernetes.io/h2c` (plaintext
#     HTTP/2) so the proxy talks upstream over HTTP/2, not HTTP/1.1.
#   - The Gateway listener the route attaches to must be HTTP (h2c) or
#     HTTPS (h2) — gRPC always rides over HTTP/2.
grpcRoutes: []
# grpcRoutes:
#   - name: example-grpc-svc
#     namespace: example-app
#     hostnames:
#       - grpc.example.local
#     backendRefs:
#       - name: example-grpc-svc
#         port: 50051
#
#   # Advanced: match by gRPC service/method instead of routing all traffic.
#   - name: example-grpc-svc-methods
#     namespace: example-app
#     hostnames:
#       - grpc.example.local
#     rules:
#       - matches:
#           - method:
#               type: Exact
#               service: example.package.ExampleService
#               method: ExampleMethod
#         backendRefs:
#           - name: example-grpc-svc
#             port: 50051

# -- Step 4 (TLS passthrough): TLSRoutes, for TCP+TLS backends such as Kafka.
# Same shape as httpRoutes but without path matches — a passthrough route can
# only pick a backend, it cannot inspect the encrypted payload.
#
# `parentRefs.sectionName` is REQUIRED here: without it the route attaches to
# every listener on the Gateway, which would send broker traffic to the
# bootstrap Service.
#
# Kafka below matches the `type: cluster-ip` listener in
# kafka-system/helm/kafka-cluster/values.yaml. Strimzi creates the Services,
# named `<clusterName>-kafka-<listenerName>-<nodeId>`, all listening on the Kafka
# listener port (9094). Every route attaches to the SAME listener (`kafka-tls`)
# and is selected by `hostnames`, which must match each broker's
# `advertisedHost`. There is no bootstrap route: clients list the broker
# hostnames as bootstrap.servers. Routes sit in the backend's own namespace, so
# no ReferenceGrant is needed.
tlsRoutes:
  - name: kafka-broker-3
    namespace: kafka-system
    parentRefs:
      - name: data-gw
        namespace: gateway-api
        sectionName: kafka-tls
    hostnames:
      - broker-3.kafka.example.local
    backendRefs:
      - name: kafka-cluster-kafka-external-3
        port: 9094

  - name: kafka-broker-4
    namespace: kafka-system
    parentRefs:
      - name: data-gw
        namespace: gateway-api
        sectionName: kafka-tls
    hostnames:
      - broker-4.kafka.example.local
    backendRefs:
      - name: kafka-cluster-kafka-external-4
        port: 9094

  - name: kafka-broker-5
    namespace: kafka-system
    parentRefs:
      - name: data-gw
        namespace: gateway-api
        sectionName: kafka-tls
    hostnames:
      - broker-5.kafka.example.local
    backendRefs:
      - name: kafka-cluster-kafka-external-5
        port: 9094

# ALTERNATIVE — ONE hostname, one port per endpoint. Each route attaches to its
# own port-specific listener and they all carry the same hostname; a fourth route
# is added for the bootstrap Service, e.g.:
#
#   - name: kafka-broker-3
#     namespace: kafka-system
#     parentRefs:
#       - name: data-gw
#         namespace: gateway-api
#         sectionName: kafka-broker-3
#     hostnames:
#       - kafka.example.local
#     backendRefs:
#       - name: kafka-cluster-kafka-external-3
#         port: 9094
#
# If instead you use a Strimzi `type: tlsroute` listener (>= 1.1.0), the
# operator creates these TLSRoutes itself — leave Kafka out of this list
# entirely, or the two will fight over the same objects.

# -- Step 5: ReferenceGrants. Only needed when a route's backendRefs (or a
# listener's certificateRefs) point at an object in a *different*
# namespace. Lives in the namespace being referenced *into*.
referenceGrants: []
# referenceGrants:
#   - name: allow-cross-ns-routes
#     namespace: example-app                # namespace of the backend Service
#     from:
#       - group: gateway.networking.k8s.io
#         kind: HTTPRoute
#         namespace: some-other-namespace     # namespace of the HTTPRoute
#     to:
#       - group: ""
#         kind: Service
#         name: example-app-svc               # omit to allow any Service in this ns
