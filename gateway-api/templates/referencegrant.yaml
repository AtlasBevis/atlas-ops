{{/*
ReferenceGrant is only needed when a route's backendRefs (or a listener's
certificateRefs) point at an object in a *different* namespace than the
route/gateway itself. It must live in the namespace being referenced *into*
(i.e. the backend's / secret's namespace), granting the route's namespace
permission to reference it.
*/}}
{{- range .Values.referenceGrants }}
---
apiVersion: gateway.networking.k8s.io/v1beta1
kind: ReferenceGrant
metadata:
  name: {{ .name }}
  namespace: {{ .namespace }}
  labels:
    {{- include "gw.labels" $ | nindent 4 }}
spec:
  from:
    {{- toYaml .from | nindent 4 }}
  to:
    {{- toYaml .to | nindent 4 }}
{{- end }}
