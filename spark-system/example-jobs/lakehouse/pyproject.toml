[project]
name = "lakehouse"
version = "0.1.0"
description = "Jobs for lakehouse"
requires-python = ">=3.10"
dependencies = ["pyspark>=4.1,<4.2", "pyyaml==6.0.3"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
lakehouse-maintenance = "lakehouse.maintenance.main:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
