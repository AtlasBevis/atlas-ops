{{- if .Values.gatewayClass.create }}
apiVersion: gateway.networking.k8s.io/v1
kind: GatewayClass
metadata:
  name: {{ .Values.gatewayClass.name }}
  labels:
    {{- include "eg.labels" . | nindent 4 }}
spec:
  controllerName: {{ .Values.config.envoyGateway.gateway.controllerName }}
  {{- if .Values.envoyProxy.create }}
  parametersRef:
    group: gateway.envoyproxy.io
    kind: EnvoyProxy
    name: {{ .Values.envoyProxy.name }}
    namespace: {{ include "eg.namespace" . }}
  {{- end }}
{{- end }}
