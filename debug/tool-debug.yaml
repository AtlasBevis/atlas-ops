apiVersion: v1
kind: Pod
metadata:
  name: debug-builder
  labels:
    app: debug-builder
    purpose: debug
spec:
  restartPolicy: Never
  imagePullSecrets:
    - name: dockerhub-regcred
  containers:
    - name: builder
      image: tool:v2
      command: ["sleep", "infinity"]
      resources:
        requests:
          cpu: 50m
          memory: 64Mi
        limits:
          cpu: 200m
          memory: 256Mi
      env: 
        - name: BUILDKIT_HOST
          value: tcp://builder.builder:1234