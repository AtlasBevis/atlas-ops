namespace: ""

nameOverride: ""
fullnameOverride: ""

# BuildKit daemon image (privileged, not rootless).
# Upstream:  moby/buildkit:v0.30.0
# Mirror:    dockerhub.company.com.vn/dwh/docker:v0.30.0
image:
  repository: moby/buildkit:v0.30.0
  tag: v0.30.0
  pullPolicy: IfNotPresent

imagePullSecrets:
  - name: dockerhub-regcred

replicas: 2

revisionHistoryLimit: 3

serviceAccount:
  create: true
  name: ""
  annotations: {}
  imagePullSecrets: []

service:
  type: ClusterIP
  port: 1234
  annotations: {}

buildkit:
  debug: false
  rootless: false
  grpcAddr: tcp://0.0.0.0:1234
  configFile: /etc/buildkit/buildkitd.toml
  # CDI is for GPU/device injection; CI image builds do not need it.
  # Leaving it enabled causes: "CDI setup error /etc/buildkit/cdi: failed to monitor..."
  cdi:
    disabled: true
    specDirs:
      - /etc/cdi
      - /var/run/cdi
      - /etc/buildkit/cdi

resources:
  requests:
    cpu: 500m
    memory: 1Gi
  limits:
    cpu: 2
    memory: 4Gi

securityContext:
  privileged: true
  allowPrivilegeEscalation: true
  readOnlyRootFilesystem: false

registry:
  # Private registry host, e.g. registry.internal:5000
  host: ""
  http: false
  insecure: false
  # Existing Secret (type kubernetes.io/dockerconfigjson) in the release namespace
  credentialsSecret: ""
  credentialsMountPath: /root/.docker

livenessProbe:
  initialDelaySeconds: 20
  periodSeconds: 30
  timeoutSeconds: 5
  successThreshold: 1
  failureThreshold: 3

readinessProbe:
  initialDelaySeconds: 5
  periodSeconds: 10
  timeoutSeconds: 3
  successThreshold: 1
  failureThreshold: 3

nodeSelector: {}

tolerations: []

affinity: {}

extraEnv: []

extraVolumes: []

extraVolumeMounts: []

podLabels: {}

podAnnotations: {}
