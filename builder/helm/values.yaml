namespace: ""

nameOverride: ""
fullnameOverride: ""

image:
  repository: moby/buildkit
  tag: v0.30.0
  pullPolicy: IfNotPresent

imagePullSecrets: []

replicas: 2

revisionHistoryLimit: 3

serviceAccount:
  create: true
  name: ""
  annotations: {}
  imagePullSecrets: []

service:
  type: ClusterIP
  port: 1234
  annotations: {}

buildkit:
  debug: false
  rootless: false
  grpcAddr: tcp://0.0.0.0:1234
  configFile: /etc/buildkit/buildkitd.toml

resources:
  requests:
    cpu: 500m
    memory: 1Gi
  limits:
    cpu: 4
    memory: 8Gi

securityContext:
  privileged: true
  allowPrivilegeEscalation: true
  readOnlyRootFilesystem: false

registry:
  # Private registry host, e.g. registry.internal:5000
  host: ""
  http: false
  insecure: false
  # Existing Secret (type kubernetes.io/dockerconfigjson) in the release namespace
  credentialsSecret: ""
  credentialsMountPath: /root/.docker

livenessProbe:
  initialDelaySeconds: 20
  periodSeconds: 30
  timeoutSeconds: 5
  successThreshold: 1
  failureThreshold: 3

readinessProbe:
  initialDelaySeconds: 5
  periodSeconds: 10
  timeoutSeconds: 3
  successThreshold: 1
  failureThreshold: 3

nodeSelector: {}

tolerations: []

affinity: {}

extraEnv: []

extraVolumes: []

extraVolumeMounts: []

podLabels: {}

podAnnotations: {}
