apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "builder.fullname" . }}
  namespace: {{ include "builder.namespace" . }}
  labels:
    {{- include "builder.labels" . | nindent 4 }}
spec:
  revisionHistoryLimit: {{ .Values.revisionHistoryLimit }}
  replicas: {{ .Values.replicas }}
  selector:
    matchLabels:
      {{- include "builder.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "builder.selectorLabels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "builder.serviceAccountName" . }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: buildkitd
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          {{- if .Values.buildkit.rootless }}
          env:
            - name: BUILDKITD_FLAGS
              value: --addr={{ .Values.buildkit.grpcAddr }} --config={{ .Values.buildkit.configFile }} --oci-worker-no-process-sandbox
            {{- with .Values.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          {{- else }}
          args:
            - --addr={{ .Values.buildkit.grpcAddr }}
            - --config={{ .Values.buildkit.configFile }}
          {{- with .Values.extraEnv }}
          env:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- end }}
          ports:
            - name: buildkit
              containerPort: {{ .Values.service.port }}
              protocol: TCP
          {{- if .Values.buildkit.rootless }}
          securityContext:
            runAsUser: 1000
            runAsGroup: 1000
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
          {{- else }}
          securityContext:
            privileged: {{ .Values.securityContext.privileged }}
            allowPrivilegeEscalation: {{ .Values.securityContext.allowPrivilegeEscalation }}
            readOnlyRootFilesystem: {{ .Values.securityContext.readOnlyRootFilesystem }}
          {{- end }}
          livenessProbe:
            tcpSocket:
              port: buildkit
            initialDelaySeconds: {{ .Values.livenessProbe.initialDelaySeconds }}
            periodSeconds: {{ .Values.livenessProbe.periodSeconds }}
            timeoutSeconds: {{ .Values.livenessProbe.timeoutSeconds }}
            successThreshold: {{ .Values.livenessProbe.successThreshold }}
            failureThreshold: {{ .Values.livenessProbe.failureThreshold }}
          readinessProbe:
            tcpSocket:
              port: buildkit
            initialDelaySeconds: {{ .Values.readinessProbe.initialDelaySeconds }}
            periodSeconds: {{ .Values.readinessProbe.periodSeconds }}
            timeoutSeconds: {{ .Values.readinessProbe.timeoutSeconds }}
            successThreshold: {{ .Values.readinessProbe.successThreshold }}
            failureThreshold: {{ .Values.readinessProbe.failureThreshold }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: buildkit-config
              mountPath: /etc/buildkit
              readOnly: true
            - name: buildkit-data
              mountPath: /var/lib/buildkit
            {{- if .Values.registry.credentialsSecret }}
            - name: registry-credentials
              mountPath: {{ ternary "/home/user/.docker" .Values.registry.credentialsMountPath .Values.buildkit.rootless }}
              readOnly: true
            {{- end }}
            {{- with .Values.extraVolumeMounts }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
      volumes:
        - name: buildkit-config
          configMap:
            name: {{ include "builder.fullname" . }}-config
        - name: buildkit-data
          emptyDir: {}
        {{- if .Values.registry.credentialsSecret }}
        - name: registry-credentials
          secret:
            secretName: {{ .Values.registry.credentialsSecret }}
            items:
              - key: .dockerconfigjson
                path: config.json
        {{- end }}
        {{- with .Values.extraVolumes }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
