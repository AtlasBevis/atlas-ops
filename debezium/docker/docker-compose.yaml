networks:
  default_net:
    external: true

services:
  connect:
    image: quay.io/debezium/connect:3.7
    container_name: connect
    ports:
      - "8083:8083"
    networks:
      - "default_net"
    environment:
      BOOTSTRAP_SERVERS: kafka:29092
      GROUP_ID: connect-cluster

      CONFIG_STORAGE_TOPIC: __connect_configs
      OFFSET_STORAGE_TOPIC: __connect_offsets
      STATUS_STORAGE_TOPIC: __connect_statuses

      CONNECT_CONFIG_STORAGE_REPLICATION_FACTOR: 1
      CONNECT_OFFSET_STORAGE_REPLICATION_FACTOR: 1
      CONNECT_STATUS_STORAGE_REPLICATION_FACTOR: 1

      KEY_CONVERTER: org.apache.kafka.connect.json.JsonConverter
      VALUE_CONVERTER: org.apache.kafka.connect.json.JsonConverter

      # load Apicurio AvroConverter bundled in the image
      ENABLE_APICURIO_CONVERTERS: "true"

      # allow ${env:VAR} in connector configs
      CONNECT_CONFIG_PROVIDERS: env
      CONNECT_CONFIG_PROVIDERS_ENV_CLASS: org.apache.kafka.common.config.provider.EnvVarConfigProvider
    healthcheck:
      test:
        ["CMD-SHELL", "curl -sf http://localhost:8083/connectors > /dev/null"]
      interval: 10s
      timeout: 5s
      retries: 20
