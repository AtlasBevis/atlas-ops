{{- if .Values.gatewayApi.enabled }}
{{- $fullName := include "airflow.fullname" . }}
{{- $apiVersion := "gateway.networking.k8s.io/v1" }}
{{- if not (.Capabilities.APIVersions.Has "gateway.networking.k8s.io/v1") }}
  {{- if .Capabilities.APIVersions.Has "gateway.networking.k8s.io/v1beta1" }}
    {{- $apiVersion = "gateway.networking.k8s.io/v1beta1" }}
  {{- else }}
    {{- fail "gatewayApi.enabled is true but neither gateway.networking.k8s.io/v1 nor v1beta1 APIs are available in the target cluster" }}
  {{- end }}
{{- end }}
{{- $globalParentRefs := .Values.gatewayApi.parentRefs | default (list) }}

{{- if and .Values.apiServer.enabled (semverCompare ">=3.0.0" .Values.airflowVersion) .Values.gatewayApi.apiServer.enabled }}
{{- $parentRefs := .Values.gatewayApi.apiServer.parentRefs | default $globalParentRefs }}
{{- if not $parentRefs }}
  {{- fail "gatewayApi.apiServer.parentRefs or gatewayApi.parentRefs must be configured when gatewayApi.apiServer.enabled=true" }}
{{- end }}
{{- $pathType := .Values.gatewayApi.apiServer.pathType | default .Values.ingress.apiServer.pathType | default "PathPrefix" }}
---
apiVersion: {{ $apiVersion }}
kind: HTTPRoute
metadata:
  name: {{ $fullName }}-api-server
  labels:
    tier: airflow
    component: airflow-api-server-httproute
    release: {{ .Release.Name }}
    chart: "{{ .Chart.Name }}-{{ .Chart.Version }}"
    heritage: {{ .Release.Service }}
    {{- with .Values.gatewayApi.apiServer.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
  {{- with .Values.gatewayApi.apiServer.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  parentRefs:
    {{- range $parentRefs }}
    - name: {{ .name | quote }}
      {{- with .group }}
      group: {{ . | quote }}
      {{- end }}
      {{- with .kind }}
      kind: {{ . | quote }}
      {{- end }}
      {{- with .namespace }}
      namespace: {{ . | quote }}
      {{- end }}
      {{- with .sectionName }}
      sectionName: {{ . | quote }}
      {{- end }}
      {{- with .port }}
      port: {{ . }}
      {{- end }}
    {{- end }}
  {{- if .Values.gatewayApi.apiServer.hostnames }}
  hostnames:
    {{- range .Values.gatewayApi.apiServer.hostnames }}
    {{- if kindIs "string" . }}
    - {{ tpl . $ | quote }}
    {{- else if .name }}
    - {{ tpl .name $ | quote }}
    {{- end }}
    {{- end }}
  {{- else if .Values.ingress.apiServer.hosts }}
  hostnames:
    {{- range .Values.ingress.apiServer.hosts }}
    {{- if kindIs "string" . }}
    - {{ tpl . $ | quote }}
    {{- else if .name }}
    - {{ tpl .name $ | quote }}
    {{- end }}
    {{- end }}
  {{- else if .Values.ingress.apiServer.host }}
  hostnames:
    - {{ tpl .Values.ingress.apiServer.host $ | quote }}
  {{- end }}
  rules:
    - matches:
        - path:
            type: {{ if eq $pathType "ImplementationSpecific" }}PathPrefix{{ else }}{{ $pathType }}{{ end }}
            value: {{ (.Values.gatewayApi.apiServer.path | default .Values.ingress.apiServer.path | default "/") | quote }}
      {{- with .Values.gatewayApi.apiServer.filters }}
      filters:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      backendRefs:
        - name: {{ $fullName }}-api-server
          port: 8080
{{- end }}

