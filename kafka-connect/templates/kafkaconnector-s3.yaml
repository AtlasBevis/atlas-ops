{{- if and .Values.connect.enabled .Values.connect.useConnectorResources }}
{{- $root := . }}
{{- range .Values.s3 }}
{{- if .enabled }}
---
apiVersion: kafka.strimzi.io/v1
kind: KafkaConnector
metadata:
  name: {{ required "s3.name is required" .name }}-s3-sink
  labels:
    {{- include "connect.labels" $root | nindent 4 }}
spec:
  class: io.confluent.connect.s3.S3SinkConnector
  tasksMax: {{ default 1 .tasksMax }}
  {{- with .state }}
  state: {{ . | quote }}
  {{- end }}
  {{- with .autoRestart }}
  autoRestart:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  config:
    {{- required "s3.config is required" .config | toYaml | nindent 4 }}
{{- end }}
{{- end }}
{{- end }}