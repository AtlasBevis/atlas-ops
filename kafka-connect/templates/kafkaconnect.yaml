{{- if .Values.connect.enabled }}
{{- $root := . }}
{{- with .Values.connect }}
apiVersion: kafka.strimzi.io/v1
kind: KafkaConnect
metadata:
  name: {{ include "connect.clusterName" $root }}
  labels:
    {{- include "connect.labels" $root | nindent 4 }}
    {{- with .metadata.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
  annotations:
    {{- if .useConnectorResources }}
    strimzi.io/use-connector-resources: "true"
    {{- end }}
    {{- with .metadata.annotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  version: {{ .version | quote }}
  replicas: {{ .replicas }}
  bootstrapServers: {{ include "connect.bootstrapServers" $root | quote }}
  groupId: {{ .groupId | default (printf "connect-%s" .name) | quote }}
  configStorageTopic: {{ .configStorageTopic | default (printf "__connect-%s-configs" .name) | quote }}
  offsetStorageTopic: {{ .offsetStorageTopic | default (printf "__connect-%s-offsets" .name) | quote }}
  statusStorageTopic: {{ .statusStorageTopic | default (printf "__connect-%s-status" .name) | quote }}
  {{- with $root.Values.imagePullSecrets }}
  imagePullSecrets:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  {{- with .image }}
  image: {{ . | quote }}
  {{- end }}
  {{- with .authentication }}
  authentication:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  {{- with .tls }}
  tls:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  config:
    {{- toYaml .config | nindent 4 }}
  {{- with .resources }}
  resources:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  {{- with .jvmOptions }}
  jvmOptions:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  {{- with .logging }}
  {{- $logType := include "connect.logging.type" $root }}
  logging:
    type: {{ $logType }}
    {{- if eq $logType "external" }}
    valueFrom:
      configMapKeyRef:
        name: {{ include "connect.logging.configMapName" $root }}
        key: log4j2.properties
    {{- else }}
    loggers:
      {{- $loggers := .loggers | default dict }}
      {{- if not (hasKey $loggers "rootLogger.level") }}
      rootLogger.level: INFO
      {{- end }}
      {{- range $pkg, $level := $loggers }}
      {{- if eq $pkg "rootLogger.level" }}
      rootLogger.level: {{ $level }}
      {{- else }}
      logger.{{ $pkg | replace "." "_" }}.name: {{ $pkg | quote }}
      logger.{{ $pkg | replace "." "_" }}.level: {{ $level | quote }}
      {{- end }}
      {{- end }}
    {{- end }}
  {{- end }}
  {{- with .build }}
  build:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  {{- with .plugins }}
  plugins:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  {{- with .metricsConfig }}
  metricsConfig:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  {{- with .rack }}
  rack:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  {{- $template := deepCopy (default dict .template) }}
  {{- if eq (include "connect.logging.type" $root) "external" }}
  {{- $pod := default dict $template.pod }}
  {{- $metadata := default dict $pod.metadata }}
  {{- $annotations := default dict $metadata.annotations }}
  {{- $_ := set $annotations "checksum/log4j2" (include "connect.logging.log4j2Checksum" $root) }}
  {{- $_ := set $metadata "annotations" $annotations }}
  {{- $_ := set $pod "metadata" $metadata }}
  {{- $_ := set $template "pod" $pod }}
  {{- end }}
  template:
    {{- tpl (toYaml $template) $root | nindent 4 }}
{{- end }}
{{- end -}}
